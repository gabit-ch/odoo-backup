version: 2
updates:
  # requirements.txt pins the complete closure; review that the "# via" comments still hold.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]

  # The python:3.14-alpine3.24 base image is pinned by digest in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-base-image:
        patterns: ["*"]

  # The workflow pins every action to a commit SHA with a "# vX.Y.Z" comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
