# The one build, test and publish pipeline of odoo-backup.
#
# lint, test and audit run in parallel; image builds the linux/amd64 and linux/arm64 images, each
# natively on a runner of its architecture, and runs the unit tests inside them; scan checks both
# images, e2e tests the amd64 one; publish pushes the multi-arch image to Docker Hub, only for a
# pushed release tag (2.0.0, never 0.x) and only when every other job passed.
#
# Every action is pinned to a commit SHA (verified through the GitHub API) with its version in a
# comment; Dependabot keeps them current. Dependabot does not track the following pins, which
# must be updated by hand: the tool binaries downloaded in lint and scan (version and SHA-256 from
# the projects' official release checksums) and the BuildKit and binfmt (QEMU) images, which
# setup-buildx-action and setup-qemu-action would otherwise pull by a mutable tag (index digest
# resolved from Docker Hub).
name: CI

on:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Superseded branch and pull request runs are cancelled; a release tag always runs to the end.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE_NAME: gabitch/odoo-backup
  TEST_IMAGE: odoo-backup:ci
  PYTHON_VERSION: '3.14'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_CACHE_DIR: '1'
  # The BuildKit daemon of every image build (image and publish): buildx's default
  # moby/buildkit:buildx-stable-1, which was v0.32.2 on 2026-09-27.
  BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

jobs:
  lint:
    name: Lint (ruff, actionlint, hadolint, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pinned development tools
        run: |
          python -m pip install --only-binary=:all: --no-deps -r requirements-dev.txt
          python -m pip check

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        run: ruff format --check --diff .

      - name: Install actionlint, hadolint and shellcheck (checksum-verified release binaries)
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p bin
          curl -fsSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C bin actionlint
          curl -fsSLo bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  bin/hadolint" | sha256sum --check --strict
          curl -fsSLo shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf shellcheck.tar.xz --strip-components=1 -C bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          chmod +x bin/*
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: actionlint (workflows; shellcheck checks the run steps)
        run: actionlint -color

      - name: hadolint
        run: hadolint Dockerfile

      - name: shellcheck (shell scripts)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts in the repository; actionlint checked the workflow run steps with shellcheck."
            exit 0
          fi
          shellcheck "${scripts[@]}"

  test:
    name: Unit tests and coverage (Python 3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pinned runtime and development dependencies
        run: |
          python -m pip install --only-binary=:all: --no-deps -r requirements-dev.txt
          python -m pip check

      - name: Run the unit tests under coverage
        run: python -X dev -W error::DeprecationWarning -m coverage run -m unittest discover -s tests -t . -v

      - name: Coverage summary and XML report
        run: |
          {
            echo "## Unit test coverage (branches, odoo_backup)"
            python -m coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml --fail-under=0 -o coverage.xml

      - name: Enforce the coverage threshold (fail_under in pyproject.toml)
        run: python -m coverage report

      - name: Upload the coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: |
          python -m pip install --only-binary=:all: --no-deps -r requirements-dev.txt
          python -m pip check

      # Both files pin their complete closure, so no resolution is needed (--no-deps --disable-pip).
      # Any known vulnerability fails the job.
      - name: Audit the runtime and development dependencies
        run: >-
          pip-audit --requirement requirements.txt --requirement requirements-dev.txt
          --no-deps --disable-pip --strict --progress-spinner off

  image:
    # Every platform that publish pushes is built and tested here first, natively (no emulation),
    # so a change that breaks only one architecture fails before a release tag is pushed.
    name: Build and test the image (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm # GitHub-hosted arm64 runner, free for public repositories
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build the ${{ matrix.arch }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ env.TEST_IMAGE }}

      - name: Run the unit tests inside the image (no network, tests mounted read-only)
        run: >-
          docker run --rm --network none
          --volume "${GITHUB_WORKSPACE}/tests:/usr/app/src/tests:ro"
          "${TEST_IMAGE}"
          python -X dev -W error::DeprecationWarning -m unittest discover -s tests -t . -v

      - name: Save the image for the scan and end-to-end jobs
        run: docker image save "${TEST_IMAGE}" --output "${RUNNER_TEMP}/odoo-backup-image.tar"

      - name: Upload the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: odoo-backup-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/odoo-backup-image.tar
          if-no-files-found: error
          retention-days: 3

  scan:
    # A job of its own: the only job with security-events: write runs no project code. Grype reads
    # the image files, so the amd64 binary scans the arm64 image as well.
    name: Vulnerability scan of the image (Grype, linux/${{ matrix.arch }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the SARIF report to code scanning
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      GRYPE_VERSION: 0.119.0
      GRYPE_SHA256: 3fa2dc4b924621ab65404cf08d0b8438d896d80ab949c9d5a4ca283c36004c9b
      GRYPE_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: odoo-backup-image-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Install Grype (checksum-verified release binary)
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p bin
          curl -fsSLo grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum --check --strict
          tar -xzf grype.tar.gz -C bin grype
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Scan the image (fails on fixable High and Critical vulnerabilities)
        run: >-
          grype "docker-archive:${RUNNER_TEMP}/odoo-backup-image.tar"
          --only-fixed --fail-on high
          --output table --output sarif=grype.sarif

      # Fork pull requests get a read-only token; their results are in the job log only. The
      # previous step alone decides about vulnerabilities: a failed upload (code scanning API,
      # quota, permissions) is a warning, it must not block a release.
      - name: Upload the SARIF report to code scanning
        if: >-
          !cancelled() && hashFiles('grype.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: grype.sarif
          category: grype-image-${{ matrix.arch }}

  e2e:
    # amd64 only: the SFTP test image (atmoz/sftp) is published for amd64 only.
    name: End-to-end test (Odoo 19, PostgreSQL 18, SFTP)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: odoo-backup-image-amd64
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker image load --input "${RUNNER_TEMP}/odoo-backup-image.tar"

      # Standard library only: the runner's system Python is enough. The driver generates every
      # credential and SSH host key it uses. A hang fails at the driver's own deadline (25 min),
      # which still collects the logs; the step timeout is the backstop and, unlike the job
      # timeout (a cancellation), it is a failure, so the logs below are uploaded either way.
      - name: Run the end-to-end scenarios
        timeout-minutes: 30
        run: python3 tests/e2e/run_e2e.py --image "${TEST_IMAGE}" --work-dir "${RUNNER_TEMP}/e2e" --deadline 1500

      - name: Upload the logs (docker compose logs, every backup container's output)
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/e2e/logs/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish the multi-arch image to Docker Hub
    needs: [lint, test, audit, image, scan, e2e]
    # Only pushed release tags (the X.Y.Z filter above), never 0.x tags. A manual run
    # (workflow_dispatch) on a tag ref does not publish: the tag filter does not apply to it.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      !startsWith(github.ref, 'refs/tags/0.')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The repository secrets DOCKER_USERNAME/DOCKER_PASSWORD keep working; the environment allows
    # protection rules (e.g. tag-only deployments, reviewers) and environment-scoped secrets.
    environment:
      name: docker-hub
      url: https://hub.docker.com/r/gabitch/odoo-backup/tags
    permissions:
      contents: read
    env:
      # setup-qemu-action's default tonistiigi/binfmt:latest, which was qemu-v10.2.3 on 2026-09-27.
      # It runs privileged and installs the emulator that builds the arm64 image.
      BINFMT_IMAGE: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (arm64 emulation for the multi-arch build)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
          cache-image: false # always pulled by digest, never restored from the Actions cache

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      # 2.0.0 -> tags 2.0.0, 2.0 and (metadata-action default flavor latest=auto) latest.
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the multi-arch image with provenance and SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
