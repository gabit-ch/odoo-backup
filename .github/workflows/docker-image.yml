name: Build and publish a Docker image

on:
  push:
    branches:
      - '*'          # Trigger on all branch pushes
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # Trigger on semantic version tags like 1.0.0
  pull_request:
    branches:
      - '*'          # Trigger on PRs for all branches

jobs:
  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    env:
      IMG_NAME: gabitch/odoo-backup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Debug
        run: echo "github.ref -> ${{ github.ref }}"

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v3
        with:
          images: ${{ env.IMG_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{sha}},enable=${{ github.ref_type != 'tag' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        if: ${{ github.ref_type == 'tag' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/0.') }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}