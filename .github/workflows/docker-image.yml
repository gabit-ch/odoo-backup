name: Build and publish a Docker image

on:
  push:
    branches:
      - '*'                        # every branch push
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'     # semantic version tags like 2.0.0
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

env:
  IMG_NAME: gabitch/odoo-backup
  # Only release tags are pushed, and never 0.x tags.
  PUSH: ${{ startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/0.') }}

jobs:
  test:
    name: Unit tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install the pinned dependencies
        run: |
          python -m pip install --only-binary=:all: --no-deps -r requirements.txt
          python -m pip check

      - name: Run the unit tests
        run: python -X dev -W error::DeprecationWarning -m unittest discover -s tests -t . -v

  image:
    name: Build, test and push the Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMG_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value={{sha}},enable=${{ github.ref_type != 'tag' }}

      - name: Build the amd64 image for the tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: odoo-backup:test

      - name: Run the unit tests inside the image (no network, tests mounted read-only)
        run: >-
          docker run --rm --network none
          --volume "${{ github.workspace }}/tests:/usr/app/src/tests:ro"
          odoo-backup:test
          python -X dev -W error::DeprecationWarning -m unittest discover -s tests -t . -v

      - name: Log in to Docker Hub
        if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build (and on release tags push) the multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
