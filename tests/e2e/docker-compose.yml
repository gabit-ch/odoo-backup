# End-to-end environment of odoo-backup: PostgreSQL 18, Odoo 19 and an SFTP server.
#
# Started and stopped by tests/e2e/run_e2e.py, which generates every credential, key and
# configuration file referenced here into E2E_WORK_DIR. The backup image itself is not a service:
# the driver runs it with `docker run --network odoo-backup-e2e`, one container per scenario.
# Images are pinned by digest (resolved from Docker Hub on 2026-09-27); Dependabot updates them.
name: odoo-backup-e2e

services:
  db:
    # The server major must not be newer than the pg_dump client in the Odoo image
    # (odoo:19.0-20260908 ships postgresql-client-18, 18.6-1.pgdg24.04+2).
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${E2E_PG_PASSWORD:?generated by run_e2e.py}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "--username=odoo", "--dbname=postgres"]
      interval: 2s
      timeout: 5s
      retries: 60

  odoo:
    image: odoo:19.0-20260908@sha256:144175ec0039d52daff1d79f7e51c9281ca3c98b96c830feb49d09764a9f5d7c
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Read by the image's entrypoint (db_host, db_user, db_password).
      HOST: db
      USER: odoo
      PASSWORD: ${E2E_PG_PASSWORD:?generated by run_e2e.py}
    volumes:
      # admin_passwd (the master password) is generated per run; list_db = True.
      - ${E2E_WORK_DIR:?generated by run_e2e.py}/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo
    ports:
      - "127.0.0.1:${E2E_ODOO_PORT:-18069}:8069"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:8069/web/health"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  sftp:
    # OpenSSH (Debian bookworm) with a chrooted, SFTP-only user from users.conf. The host keys are
    # generated by the driver, so it knows the exact fingerprint to pin. The user's UID/GID are the
    # ones of the account running the driver: the backups land in sftp-data owned by that account,
    # which lets the driver seed and inspect them directly.
    image: atmoz/sftp:debian@sha256:75dcc29683ad479bdb99010666f2f55e99014350a1e862fe32b565845feb0fcd
    volumes:
      - ${E2E_WORK_DIR:?generated by run_e2e.py}/sftp/users.conf:/etc/sftp/users.conf:ro
      - ${E2E_WORK_DIR:?generated by run_e2e.py}/sftp/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ${E2E_WORK_DIR:?generated by run_e2e.py}/sftp/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key:ro
      - ${E2E_WORK_DIR:?generated by run_e2e.py}/sftp-data:/home/e2e/upload
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/22"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  odoo-data:

networks:
  default:
    name: odoo-backup-e2e
